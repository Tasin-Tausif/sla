services:
  - type: web
    name: sla-tickets
    runtime: docker
    plan: free
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: Support Ticket SLA
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: FORCE_HTTPS
        value: "true"
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: MYSQL_ATTR_SSL_CA
        value: /etc/ssl/cert.pem
      - key: TICKETS_FULLTEXT_SEARCH
        value: "false"
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: DB_QUEUE_RETRY_AFTER
        value: "3700"
      - key: MAIL_MAILER
        value: log
      - key: SEED_PASSWORD
        sync: false
      - key: RUN_MIGRATIONS
        value: "true"
      - key: RUN_SEED
        value: "true"
      - key: DOCKER_SEED_DEMO
        value: "false"
      - key: DB_PROTECT_DESTRUCTIVE
        value: "true"
