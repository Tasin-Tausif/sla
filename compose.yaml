services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage
    environment:
      APP_NAME: Support Ticket SLA
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: sla
      DB_USERNAME: sla
      DB_PASSWORD: ${DB_PASSWORD:-sla_local_password}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      DB_QUEUE_RETRY_AFTER: 3700
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM_ADDRESS: support@example.com
      RUN_SEED: "true"
      SEED_DEMO: "true"
      DB_PROTECT_DESTRUCTIVE: "true"
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: sla
      MYSQL_USER: sla
      MYSQL_PASSWORD: ${DB_PASSWORD:-sla_local_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_local_password}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
  mailpit:
    image: axllent/mailpit
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
# Default passwords are local-demo defaults only; override them with environment variables.
volumes:
  db_data:
  app_storage:
